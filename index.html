<style>

.fr{display:flex;gap:6px;align-items:center}.fr input{flex:1}

@media(max-width:768px){.ly{flex-direction:column;padding:12px}.pd{width:100%;position:static;max-height:none}.sg{grid-template-columns:repeat(2,1fr)}.t2,.t3{margin-left:30px}}
</style>
</head>
